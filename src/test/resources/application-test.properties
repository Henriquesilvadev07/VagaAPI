# Nome da aplicação para os testes
spring.application.name=Vagas Test

# NOTA: A URL, username e password do datasource NÃO precisam ser fixas aqui,
# pois o Testcontainers (@DynamicPropertySource) vai sobrescrevê-las dinamicamente
# com o container do PostgreSQL rodando!
# Mas se quiser deixar um driver padrão do PostgreSQL, ajuda o Hibernate:
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false

# Chave JWT estática para simular os testes
api.security.token.secret=12345_segredo_para_testes