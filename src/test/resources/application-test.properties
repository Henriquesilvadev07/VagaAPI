# Nome da aplicação para os testes
spring.application.name=Vagas Test

# Configuração do Banco H2 em Memória
spring.datasource.url=jdbc:h2:mem:vagas_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto do H2 (permite simular funções do PostgreSQL se necessário)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Para os testes, o Hibernate pode criar e destruir a estrutura em memória
spring.jpa.hibernate.ddl-auto=create-drop

# Desativa o Flyway nos testes de unidade/integração leves
# (o ddl-auto=create-drop já vai gerar as tabelas com base nas suas @Entity)
spring.flyway.enabled=false

# Chave JWT estática para simular os testes
api.security.token.secret=12345_segredo_para_testes