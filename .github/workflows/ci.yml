name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia o código do teu repositório para a máquina virtual do GitHub
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java 21 com Temurin e cache do Maven para acelerar o build
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compila a aplicação e executa a tua suíte de testes de ponta a ponta
      - name: Compilar e Executar Testes
        run: mvn -B test --file pom.xml